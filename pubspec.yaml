name: kolekt
description: nOVa — gestion numérique de tontines (frontend, navigation + données simulées)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.6.2
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  google_fonts: ^6.2.1
  supabase_flutter: ^2.9.0
  share_plus: ^13.3.1
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.10.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/app_icon.png"
